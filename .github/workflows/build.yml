name: Build iOS Dylib

on:
  workflow_dispatch:
  push:

jobs:
  build:
  runs-on: macos-latest
  steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 编译 arm64 架构动态库
      run: |
        xcrun -sdk iphoneos clang -arch arm64 -shared -framework Foundation -o FixSiriCrash.dylib FixSiriCrash.m

    - name: 打包上传
      uses: actions/upload-artifact@v4
      with:
        name: FixSiriCrash-Dylib
        path: FixSiriCrash.dylib
